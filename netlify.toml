# Netlify configuration — ECOFlow frontend (https://docs.netlify.com/configure-builds/file-based-configuration/)
# Commit this file at the repo root of the frontend repository (client/ if deploying
# a monorepo — set "Base directory: client" in the Netlify UI in that case).

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Public URL of the deployed backend (Render service URL from render.yaml).
  # Also set VITE_API_URL in the Netlify UI (Site configuration → Environment variables)
  # so the notifications SSE stream can reach the API:
  #   VITE_API_URL = "https://ecoflow-backend.onrender.com/api"
  VITE_API_URL = "https://ecoflow-backend.onrender.com/api"

# Long-term caching for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for the SPA
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# API calls go straight to the backend URL (see VITE_API_URL); SPA fallback LAST
# so client-side routes like /dashboard render index.html on hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
